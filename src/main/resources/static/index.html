<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CBDVentures — Pretoria CBD in Your Pocket</title>
  <meta name="description" content="CBDVentures dark edition: discover verified eateries, salons, study spots and events within 1 km of Richfield in the Pretoria CBD.">
  <meta name="theme-color" content="#0B0B0D">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="/images/logo-dark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/images/logo-dark.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <script src="/js/theme-preload.js?v=20261112-1"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
          .then((registration) => registration.update())
          .catch(() => {});
      }, { once: true });
    }
  </script>
  <link rel="stylesheet" href="/css/app.css?v=20261112-1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div id="offline-banner" class="offline-banner" role="status" hidden>
    You are offline — showing saved listings. Anything you tap will work once you reconnect.
  </div>

  <div class="app" id="app">
    <!-- Compact top bar; on welcome and auth screens it keeps only the theme switch. -->
    <header class="topbar" id="topbar">
      <a class="topbar__brand" href="#/" aria-label="CBDVentures home — a project by NxG Technologies">
        <img src="/images/logo-dark.svg" alt="" width="32" height="32">
        <span>CBDVentures</span>
        <img class="nxg-mark topbar__nxg" src="/images/nxg-logo.png?v=20261112-1" alt="NxG monogram" width="24" height="24">
      </a>
      <div class="topbar__actions">
        <button class="theme-toggle" type="button" id="theme-toggle" aria-label="Switch to light mode" aria-pressed="false">
          <span id="theme-toggle-icon" aria-hidden="true"></span>
        </button>
        <button class="icon-button" type="button" id="notify-button" aria-label="Notifications">
          <span data-icon="bell"></span>
          <i class="dot" aria-hidden="true"></i>
        </button>
        <a class="avatar avatar--sm" id="topbar-avatar" href="#/profile" aria-label="Your profile">
          <span data-icon="user"></span>
        </a>
      </div>
    </header>

    <main id="main" class="screen" tabindex="-1"></main>

    <!-- Bottom tab bar (mobile reference layout). Becomes a left rail at desktop width.
         "Ask" opens the CBD Ventures AI Assistance guide. -->
    <nav class="tabbar" id="tabbar" aria-label="Primary">
      <a href="#/" data-tab="discover"><span data-icon="home"></span><small>Discover</small></a>
      <a href="#/explore" data-tab="explore"><span data-icon="search"></span><small>Explore</small></a>
      <a href="#/map" data-tab="map"><span data-icon="map"></span><small>Map</small></a>
      <a href="#/assistant" data-tab="assistant"><span data-icon="sparkles"></span><small>Ask</small></a>
      <a href="#/events" data-tab="events"><span data-icon="ticket"></span><small>Events</small></a>
      <a href="#/profile" data-tab="profile"><span data-icon="user"></span><small>Profile</small></a>
    </nav>
  </div>

  <div id="toast-stack" class="toast-host" aria-live="polite" aria-atomic="true"></div>
  <div id="modal-root"></div>

  <script type="module" src="/js/app.js?v=20261112-1"></script>
</body>
</html>
